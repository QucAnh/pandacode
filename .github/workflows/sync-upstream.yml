name: Sync upstream pandacode
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "pandacode-sync"
          git config user.email "sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/aicodeking/pandacode.git
          git fetch upstream main
          git fetch origin main

      - name: Merge upstream
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              echo "result=uptodate" >> "$GITHUB_OUTPUT"
            else
              echo "result=clean" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      # A clean merge can still break the schema (both sides may add the same
      # migration number), so verify before anything reaches main or a release.
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.result == 'clean'
        with: { node-version: '22', cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.merge.outputs.result == 'clean'

      - uses: Swatinem/rust-cache@v2
        if: steps.merge.outputs.result == 'clean'
        with:
          workspaces: src-tauri

      - name: Install Linux native dependencies
        if: steps.merge.outputs.result == 'clean'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf

      - name: Install dependencies
        if: steps.merge.outputs.result == 'clean'
        run: npm ci

      - name: Typecheck and unit tests
        if: steps.merge.outputs.result == 'clean'
        run: |
          npx tsc --noEmit
          npm test

      - name: Build frontend and test storage
        if: steps.merge.outputs.result == 'clean'
        run: |
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib storage

      - name: Push to main and tag release
        if: steps.merge.outputs.result == 'clean'
        run: |
          git push --force-with-lease origin HEAD:refs/heads/main
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Pushed main and tagged v$VERSION"

      - name: Open or update conflict issue
        if: steps.merge.outputs.result == 'conflict'
        run: |
          cat > /tmp/body.md <<'EOF'
          Upstream main no longer merges cleanly into `main`.

          Resolve it locally:

          ```sh
          git fetch origin main
          git checkout -B upstream-sync origin/main
          git remote add upstream https://github.com/aicodeking/pandacode.git   # once
          git fetch upstream main
          git merge upstream/main   # resolve the conflicts
          git push --force-with-lease origin upstream-sync
          ```

          Then open or update the PR into `main`. Later runs update that same
          PR and close this issue once the merge is clean.
          EOF
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Upstream sync conflict") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file /tmp/body.md
            echo "Updating issue #$number"
          else
            gh issue create --title "Upstream sync conflict" --body-file /tmp/body.md
          fi

      - name: Open or update verification issue
        if: failure() && steps.merge.outputs.result == 'clean'
        run: |
          cat > /tmp/body.md <<EOF
          The upstream merge was clean, but verification failed, so nothing was
          pushed to \`main\` and no release was tagged.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Resolve it locally:

          \`\`\`sh
          git fetch origin main
          git checkout -B upstream-sync origin/main
          git fetch upstream main
          git merge upstream/main
          npx tsc --noEmit && npm test
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib storage
          git push --force-with-lease origin upstream-sync
          \`\`\`
          EOF
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Upstream sync failed verification") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file /tmp/body.md
            echo "Updating issue #$number"
          else
            gh issue create --title "Upstream sync failed verification" --body-file /tmp/body.md
          fi

      - name: Close conflict issue after a clean merge
        if: success() && steps.merge.outputs.result != 'conflict'
        run: |
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Upstream sync conflict") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Upstream merges cleanly again; synced to main and released as v$(node -p "require('./package.json').version")."
          fi

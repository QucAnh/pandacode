name: Sync upstream pandacode
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "pandacode-sync"
          git config user.email "sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/aicodeking/pandacode.git
          git fetch upstream main
          git fetch origin upstream-sync || true

      - name: Merge upstream
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              echo "result=uptodate" >> "$GITHUB_OUTPUT"
            else
              echo "result=clean" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.merge.outputs.result == 'clean'
        run: git push --force-with-lease origin HEAD:refs/heads/upstream-sync

      - name: Open or update pull request
        if: steps.merge.outputs.result == 'clean'
        run: |
          cat > /tmp/body.md <<'EOF'
          Automated sync from https://github.com/aicodeking/pandacode.

          Merged cleanly in CI. Review the diff, let CI run, and merge once
          `cargo test --lib storage` passes: a clean merge can still break
          schema migrations.
          EOF
          number=$(gh pr list --head upstream-sync --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file /tmp/body.md
            echo "Updating PR #$number"
          else
            gh pr create --base main --head upstream-sync --title "Sync upstream pandacode" --body-file /tmp/body.md
          fi

      - name: Open or update conflict issue
        if: steps.merge.outputs.result == 'conflict'
        run: |
          cat > /tmp/body.md <<'EOF'
          Upstream main no longer merges cleanly into `main`.

          Resolve it locally:

          ```sh
          git fetch origin main
          git checkout -B upstream-sync origin/main
          git remote add upstream https://github.com/aicodeking/pandacode.git   # once
          git fetch upstream main
          git merge upstream/main   # resolve the conflicts
          git push --force-with-lease origin upstream-sync
          ```

          Then open or update the PR into `main`. Later runs update that same
          PR and close this issue once the merge is clean.
          EOF
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Upstream sync conflict") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file /tmp/body.md
            echo "Updating issue #$number"
          else
            gh issue create --title "Upstream sync conflict" --body-file /tmp/body.md
          fi

      - name: Close conflict issue after a clean merge
        if: steps.merge.outputs.result != 'conflict'
        run: |
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Upstream sync conflict") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Upstream merges cleanly again; review the sync pull request."
          fi
